  <script>
    const cards = [...document.querySelectorAll('.waqaf-card')];
    const targets = [...document.querySelectorAll('.drop-target')];
    const cardsStack = document.getElementById('cards-stack');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const statusBox = document.getElementById('status-box');
    const statusIcon = document.getElementById('status-icon');
    const statusMessage = document.getElementById('status-message');
    const winPanel = document.getElementById('win-panel');
    const resetBtn = document.getElementById('reset-btn');

    let draggedCard = null;
    let pointerOffsetX = 0;
    let pointerOffsetY = 0;
    let score = 0;
    let matched = 0;
    let seconds = 60;
    let timerInterval = null;
    let hasStarted = false;

    const originalOrder = cards.map(card => card.id);

    function playTone(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const context = new AudioContext();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.type = type === 'success' ? 'sine' : 'sawtooth';
        oscillator.frequency.value = type === 'success' ? 880 : 150;
        gain.gain.setValueAtTime(.08, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + (type === 'success' ? .24 : .35));
        oscillator.start();
        oscillator.stop(context.currentTime + (type === 'success' ? .24 : .35));
      } catch (e) {}
    }

    function updateTimer() {
      const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
      const remaining = String(seconds % 60).padStart(2, '0');
      timerDisplay.textContent = minutes + ':' + remaining;
    }

    function startTimer() {
      if (hasStarted || matched === cards.length) return;
      hasStarted = true;
      timerInterval = setInterval(() => {
        if (seconds > 0) {
          seconds -= 1;
          updateTimer();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          showStatus('⏰', 'Waktu habis! Diskusikan kembali pasangan tanda waqafnya.');
        }
      }, 1000);
    }

    function showStatus(icon, message, wrong = false) {
      statusIcon.textContent = icon;
      statusMessage.textContent = message;
      statusBox.classList.remove('shake');
      void statusBox.offsetWidth;
      if (wrong) statusBox.classList.add('shake');
    }

    function getTargetAtPoint(x, y) {
      return targets.find(target => {
        const rect = target.getBoundingClientRect();
        return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
      });
    }

    function clearTargetHighlight() {
      targets.forEach(target => target.classList.remove('is-over'));
    }

    function handlePointerDown(event) {
      const card = event.currentTarget;
      if (card.classList.contains('matched') || seconds === 0) return;
      event.preventDefault();
      startTimer();
      draggedCard = card;
      const rect = card.getBoundingClientRect();
      pointerOffsetX = event.clientX - rect.left;
      pointerOffsetY = event.clientY - rect.top;
      card.setPointerCapture(event.pointerId);
      card.classList.add('dragging');
      card.style.width = rect.width + 'px';
      card.style.position = 'fixed';
      card.style.left = rect.left + 'px';
      card.style.top = rect.top + 'px';
      card.style.zIndex = '60';
      document.body.appendChild(card);
    }

    function handlePointerMove(event) {
      if (!draggedCard) return;
      draggedCard.style.left = (event.clientX - pointerOffsetX) + 'px';
      draggedCard.style.top = (event.clientY - pointerOffsetY) + 'px';
      clearTargetHighlight();
      const activeTarget = getTargetAtPoint(event.clientX, event.clientY);
      if (activeTarget && !activeTarget.classList.contains('is-filled')) activeTarget.classList.add('is-over');
    }

    function returnCard(card) {
      card.classList.remove('dragging');
      card.removeAttribute('style');
      const cardOrder = originalOrder.indexOf(card.id);
      const nextCard = [...cardsStack.children].find(item => originalOrder.indexOf(item.id) > cardOrder);
      cardsStack.insertBefore(card, nextCard || null);
    }

    function handlePointerUp(event) {
      if (!draggedCard) return;
      const card = draggedCard;
      const target = getTargetAtPoint(event.clientX, event.clientY);
      clearTargetHighlight();

      if (target && !target.classList.contains('is-filled') && card.dataset.answer === target.dataset.target) {
        card.classList.remove('dragging');
        card.removeAttribute('style');
        target.appendChild(card);
        target.classList.add('is-filled');
        card.classList.add('matched');
        card.style.width = 'auto';
        matched += 1;
        score += 10;
        scoreDisplay.textContent = score;
        playTone('success');
        showStatus('✔', 'Benar! Pasangan tanda waqaf sudah tepat.');
        statusIcon.classList.add('feedback-pop');
        setTimeout(() => statusIcon.classList.remove('feedback-pop'), 500);

        if (matched === cards.length) completeGame();
      } else {
        playTone('error');
        showStatus('✖', 'Belum tepat. Kartu kembali ke tempat semula — coba lagi!', true);
        returnCard(card);
      }
      draggedCard = null;
    }

    function completeGame() {
      clearInterval(timerInterval);
      showStatus('🌟', 'Hebat! Kamu berhasil mendapatkan 100 poin.');
      winPanel.classList.add('show');
      launchConfetti();
      setTimeout(() => winPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 250);
    }

    function launchConfetti() {
      const colors = ['#f3bd46', '#18af7d', '#ffffff', '#ef5d5d', '#5dc2e7'];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty('--drift', (Math.random() * 260 - 130) + 'px');
        piece.style.animationDelay = (Math.random() * .55) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3700);
      }
    }

    function resetGame() {
      clearInterval(timerInterval);
      timerInterval = null;
      hasStarted = false;
      seconds = 60;
      score = 0;
      matched = 0;
      updateTimer();
      scoreDisplay.textContent = '0';
      winPanel.classList.remove('show');
      targets.forEach(target => {
        target.classList.remove('is-filled', 'is-over');
        const number = target.querySelector('.target-number');
        const label = target.querySelector('p');
        target.innerHTML = '';
        target.appendChild(number);
        target.appendChild(label);
      });
      originalOrder.forEach(id => {
        const card = document.getElementById(id);
        card.classList.remove('matched', 'dragging');
        card.removeAttribute('style');
        cardsStack.appendChild(card);
      });
      showStatus('✨', 'Mulai seret kartu ke pasangan yang tepat!');
      document.getElementById('challenge-note').classList.remove('show');
    }

    cards.forEach(card => {
      card.addEventListener('pointerdown', handlePointerDown);
      card.addEventListener('pointermove', handlePointerMove);
      card.addEventListener('pointerup', handlePointerUp);
      card.addEventListener('pointercancel', () => {
        if (draggedCard) {
          returnCard(draggedCard);
          draggedCard = null;
          clearTargetHighlight();
        }
      });
    });

    resetBtn.addEventListener('click', resetGame);

    document.querySelectorAll('.ayah-sign').forEach(sign => {
      sign.addEventListener('click', () => {
        const note = document.getElementById('challenge-note');
        if (sign.dataset.sign === 'mim') {
          note.textContent = 'Tanda م (Waqaf Lazim): berhenti lebih utama dan dianjurkan untuk menjaga makna bacaan.';
        } else {
          note.textContent = 'Tanda لا (Laa): tidak boleh berhenti pada tanda ini karena dapat mengubah atau memutus makna.';
        }
        note.classList.add('show');
      });
    });

    updateTimer();
    lucide.createIcons();
  </script>
 </body>
</html>
